<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banda de TL | Crear Cuenta</title>
    <!-- Conexión a tu archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú oficial de Banda de TL -->
    <header>
        <div class="logo">
            <h2>Banda de <span>TL</span></h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar sesion</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor del Formulario de Registro -->
    <main class="auth-container">
        <div class="auth-box">
            <h2>                                    Registrate</h2>
            <p class="auth-subtitle">Regístrate en Banda de TL para acceder a nuestro catálogo textil exclusivo</p>
            
            <form id="form-register">
                <!-- Campo: Nombre de la Empresa o Cliente -->
                <div class="input-group">
                    <label for="reg-name">Nombre Completo / Razón Social</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre o el de tu fábrica" required>
                </div>

                <!-- Campo: Correo -->
                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="correo@bandadetl.com" required>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Crea una contraseña segura" required>
                </div>

                <!-- Botón de Registro -->
                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <!-- Enlace para volver al login -->
            <p class="auth-switch">
                ¿Ya eres parte de la banda? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

    <!-- Pie de Página de la marca -->
    <footer>
        <p>&copy; 2026 Banda de TL. Todos los derechos reservados.</p>
    </footer>

    <script>
        const formRegister = document.getElementById('form-register');

        formRegister.addEventListener('submit', function(evento) {
            evento.preventDefault();

            const emailInput = document.getElementById('reg-email').value;
            const passwordInput = document.getElementById('reg-password').value;

            localStorage.setItem('usuarioRegistrado', emailInput);
            localStorage.setItem('passwordRegistrada', passwordInput);

            alert('¡Registro exitoso en Banda de TL! Ahora inicia sesión.');
            
            // Te manda al login para que ingreses con tu nueva cuenta
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
