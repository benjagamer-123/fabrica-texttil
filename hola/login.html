<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banda de TL | Iniciar Sesión</title>
    <!-- Conexión al mismo CSS del index para mantener los estilos base -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú idéntico al index para mantener coherencia -->
    <header>
        <div class="logo">
            <h2>Banda de <span>TL</span></h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html" class="btn-nav">Iniciar sesion</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor del Formulario de Login -->
    <main class="auth-container">
        <div class="auth-box">
            <h2>Ingresar a tu Cuenta</h2>
            <p class="auth-subtitle">Accede a precios mayoristas y gestiona tus pedidos de tela</p>
            
            <form id="form-login">
                <!-- Campo: Correo -->
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <!-- Botón de Entrar -->
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <!-- Enlace para ir al registro -->
            <p class="auth-switch">
                ¿Eres un cliente nuevo? <a href="register.html">Crea una cuenta aquí</a>
            </p>
        </div>
    </main>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 TextilPro Fábrica. Todos los derechos reservados.</p>
    </footer>

    <!-- LÓGICA DE JAVASCRIPT: Activa la sesión y te redirige -->
    <script>
        const formLogin = document.getElementById('form-login');

        formLogin.addEventListener('submit', function(evento) {
            evento.preventDefault(); // Evita que la página se recargue

            // Guardamos en la memoria que el usuario ya inició sesión de verdad
            localStorage.setItem('sesionActiva', 'true');

            alert('¡Sesión iniciada correctamente! Bienvenido a TextilPro.');
            
            // Te devuelve al index automáticamente donde ya tendrás los accesos liberados
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
